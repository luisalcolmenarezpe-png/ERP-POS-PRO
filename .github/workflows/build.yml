name: Build Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Construir APK de Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Parche Quirúrgico de Paquetes (Python)
        run: |
          python3 -c "
          import glob

          # 1. Parchar namespace en blue_thermal_printer dentro del pub-cache
          for f in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/blue_thermal_printer-*/android/build.gradle'):
              with open(f, 'r') as file:
                  content = file.read()
              if 'namespace' not in content:
                  content = content.replace('android {', 'android {\n    namespace \"com.blue.thermal.printer\"')
                  with open(f, 'w') as file:
                      file.write(content)
                  print('Namespace aplicado a:', f)

          # 2. Reemplazar jcenter() por mavenCentral() en todo el pub-cache
          for f in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/**/android/build.gradle', recursive=True):
              with open(f, 'r') as file:
                  content = file.read()
              if 'jcenter()' in content:
                  content = content.replace('jcenter()', 'mavenCentral()')
                  with open(f, 'w') as file:
                      file.write(content)
                  print('jcenter reemplazado en:', f)
          "

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Compilar ejecutable de Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-app
          path: build/windows/x64/runner/Release
