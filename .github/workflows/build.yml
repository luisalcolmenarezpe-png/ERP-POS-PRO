name: Build ERP Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Parchear namespace de blue_thermal_printer
        run: |
          MANIFEST="/home/runner/.pub-cache/hosted/pub.dev/blue_thermal_printer-1.2.3/android/AndroidManifest.xml"
          GRADLE="/home/runner/.pub-cache/hosted/pub.dev/blue_thermal_printer-1.2.3/android/build.gradle"
          if [ -f "$MANIFEST" ] && [ -f "$GRADLE" ]; then
            PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST")
            echo "Namespace detectado: $PKG"
            if ! grep -q "namespace" "$GRADLE"; then
              sed -i "/android {/a \    namespace '$PKG'" "$GRADLE"
            fi
          fi

      - name: Construir APK Release
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: erp-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Compilar Ejecutable Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir Windows Release
        run: flutter build windows --release

      - name: Subir Ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: erp-windows-executable
          path: build/windows/x64/runner/Release/
