- name: Generar plataforma Android
        run: flutter create . --platforms=android

      - name: Usar AGP 7.4.2 para evitar errores de namespace
        run: |
          sed -i 's/com.android.tools.build:gradle:8\.[0-9]\.[0-9]/com.android.tools.build:gradle:7.4.2/g' android/build.gradle || true
          sed -i 's/gradle-8\.[0-9]*-all.zip/gradle-7.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
