name: Build ERP Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Solucionar error de Namespace en librerías
        run: |
          # Buscar el archivo build.gradle de la librería problemática
          GRADLE_FILE=$(find /home/runner/.pub-cache -name "build.gradle" | grep "blue_thermal_printer" | head -n 1)
          
          if [ -f "$GRADLE_FILE" ]; then
            echo "Archivo encontrado en: $GRADLE_FILE"
            if ! grep -q "namespace" "$GRADLE_FILE"; then
              echo "Aplicando parche de namespace..."
              # Inyectar el namespace justo después de la línea 'android {'
              sed -i "/android {/a \    namespace 'id.kakzaki.blue_thermal_printer'" "$GRADLE_FILE"
              echo "Namespace inyectado correctamente."
            else
              echo "El namespace ya existe."
            fi
          else
            echo "No se encontró el archivo de la librería. Continuando..."
          fi

      - name: Construir APK Release
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: erp-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Compilar Ejecutable Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir Windows Release
        run: flutter build windows --release

      - name: Subir Ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: erp-windows-executable
          path: build/windows/x64/runner/Release/
          
