name: Build Apps
on: [push, workflow_dispatch]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Limpiar carpetas basura o duplicadas
        run: |
          rm -rf ERP-POS-PRD
          pwd
          ls -la

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Forzar Namespace en Blue Thermal Printer
        run: |
          python3 -c "
          import glob, os
          for f in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/blue_thermal_printer-*/android/build.gradle'):
              with open(f, 'r') as file:
                  content = file.read()
              if 'namespace' not in content:
                  content = content.replace('android {', 'android {\n    namespace \"com.blue.thermal.printer\"')
                  with open(f, 'w') as file:
                      file.write(content)
                  print('¡PARCHE APLICADO EXITOSAMENTE A:', f)
              else:
                  print('Ya tiene namespace:', f)
          "

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-app
          path: build/windows/x64/runner/Release
          
